<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wooldom</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage">
  <div id="topbar">
    <span class="gname">WOOLDOM</span>
    <span id="seatChips"></span>
    <span class="stat">SATCHEL <b id="hSatchel">&mdash;</b></span>
    <span id="hModules"></span>
    <span id="hoverinfo"></span>
  </div>
  <div id="wrap">
    <!-- the width/height attributes are the canvas's backing-store size and must
         stay literal here: test/audio-smoke.js parses width="960" out of this
         file, and ui.js/render.js derive the whole view transform from
         cv.width/cv.height. CSS scales the element; it never sets these. -->
    <canvas id="cv" width="960" height="540" role="img"
            aria-label="The pasture board. Scores and the tile in hand are reported around it."></canvas>
    <!-- the last three things that scored, folded away until asked for -->
    <div id="movelog" class="collapsed">
      <button id="logToggle" type="button" aria-expanded="false" aria-controls="logLines"
              title="Show the last few scores">MOVES</button>
      <div id="logLines"></div>
    </div>
  </div>
  <div id="tray">
    <canvas id="trayCv" width="96" height="96" aria-hidden="true"></canvas>
    <div id="trayInfo"></div>
    <div id="trayBtns"></div>
  </div>
  <!-- one strip, two jobs: the standing control reminder, and — over the top of
       it during a first game — the contextual teaching hints. #hintSkip only
       appears while a teaching hint is up, and turns the whole flow off. -->
  <div id="hintbar" class="off">
    <span class="ht" id="hintText"></span>
    <button id="hintSkip" class="hs" type="button" hidden
            title="Stop showing first-game hints">NO MORE HINTS</button>
    <button id="hintClose" class="hx" type="button" title="Got it">&#10005;</button>
  </div>
  <div id="panel"></div>

  <!-- spoken, not seen. Two regions, one owner each: #sr carries the turn and
       the board's answers, #srHint carries the teaching hints. Sharing one
       meant whichever wrote last won, and the banner writes last every frame —
       so the tutorial was announced to nobody. -->
  <div id="sr" class="vh" role="status" aria-live="polite"></div>
  <div id="srHint" class="vh" role="status" aria-live="polite"></div>

  <!-- settings popover -->
  <div id="settings">
    <div class="setcard hidden" id="setcard" role="dialog" aria-label="Settings">
      <div class="settitle">SETTINGS</div>
      <div class="setrow"><label for="volSfx">SFX</label>
        <input type="range" min="0" max="100" value="100" id="volSfx" class="vol">
        <span class="setval" id="volSfxV">100</span></div>
      <div class="setrow"><label for="volMus">MUSIC</label>
        <input type="range" min="0" max="100" value="100" id="volMus" class="vol">
        <span class="setval" id="volMusV">100</span></div>
      <button class="sbtn" id="bCalm" type="button"
        title="Calm mode: no shake, no pulsing, no flashes">CALM OFF</button>
      <button class="sbtn" id="bSkipAI" type="button"
        title="Skip the pause before each AI move — the move itself is unchanged">SKIP AI ANIMATION OFF</button>
      <button class="sbtn" id="bHints" type="button"
        title="Show the first-game teaching hints again">HINTS ON</button>
      <button class="sbtn warn" id="bReset" type="button"
        title="Erase the saved game and settings">RESET PROGRESS</button>
      <button class="sbtn" id="setClose" type="button">CLOSE</button>
    </div>
  </div>

  <!-- title / new game setup -->
  <div class="overlay" id="menu">
    <canvas id="logoCv" width="128" height="48"
            style="width:256px;height:96px;image-rendering:pixelated" aria-hidden="true"></canvas>
    <h1 class="logo">WOOLDOM</h1>
    <div class="tagline">lay the land. post the shepherds. count the meadows.</div>
    <div id="menuRoot"></div>
  </div>

  <!-- end-of-game reveal + summary -->
  <div class="overlay hidden" id="end">
    <h2 class="ovtitle" id="eTitle"></h2>
    <div class="ovsub" id="eStats"></div>
    <div id="eTable"></div>
    <div id="eBest" class="best" hidden></div>
    <div class="hint" id="eHint"></div>
    <div class="btnrow">
      <button class="bigbtn" id="eAgain" type="button">PLAY AGAIN</button>
      <button class="bigbtn ghost" id="eMenu" type="button">MENU</button>
    </div>
  </div>
</div>
<footer>a tile-laying pastoral &middot; html5 canvas &middot; no dependencies</footer>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/tiles.js"></script>
<script src="js/board.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
